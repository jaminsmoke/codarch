# Copia este fichero a .codarch.yml y ajusta las capas a tu proyecto.
# Las reglas se evalúan en `codarch diff`, no en `codarch analyze`.
version: 1

# `codarch lint` lee el lint que ya tiene el proyecto: detecta su configuración
# (eslint.config.*, .eslintrc*, oxlint.json, biome.json, ruff.toml,
# checkstyle.xml…) y ejecuta el binario instalado. El bloque `lint:` es un
# override opcional para comandos que la detección no cubre; si está, manda
# (ADR 0096).
# lint:
#   - name: eslint
#     command: node node_modules/eslint/bin/eslint.js . --format json
#     format: eslint-json

# Qué queda fuera del análisis (ADR 0038). Sintaxis de `.gitignore`, relativa
# a la raíz del repo. Se aplica antes de recorrer: un fichero excluido no entra
# en el mapa, las métricas, los ciclos ni el checksum. No hay una exclusión
# por defecto de tests o fixtures; si este repo los tiene, se declaran aquí.
# ignore:
#   - vendor/**
#   - "**/*.stories.tsx"

layers:
  - name: domain
    paths:
      - src/domain/**
  - name: application
    paths:
      - src/application/**
  - name: infrastructure
    paths:
      - src/infra/**

rules:
  - name: domain-no-infra
    type: forbidden
    from: domain
    to: infrastructure
    severity: error
    message: El dominio no puede depender de infraestructura

  - name: complejidad-maxima
    type: threshold
    metric: maxComplexity
    max: 40
    severity: warn

  - name: sin-ciclos
    type: cycles
    severity: error
