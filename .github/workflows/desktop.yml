name: CodArch Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "packages/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: write

jobs:
  build:
    name: Empaquetar ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm ci

      - name: Construir el proceso principal y el renderer
        run: npm run desktop:build

      # electron-builder recompila los módulos nativos (tree-sitter) para el ABI
      # de Electron: en Windows hace falta la carga de trabajo de C++.
      - name: Empaquetar
        working-directory: apps/desktop
        run: npx electron-builder --publish never

      # Solo los instaladores: la carpeta "unpacked" lleva los binarios
      # sueltos y GitHub limita las peticiones al subir assets.
      - uses: actions/upload-artifact@v7
        with:
          name: codarch-desktop-${{ matrix.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.blockmap
          if-no-files-found: error

  release:
    name: Publicar el release
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: instaladores
          pattern: codarch-desktop-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: instaladores/**
          generate_release_notes: true
          body: |
            Instaladores de CodArch Desktop, **sin firmar**.

            En Windows y macOS el sistema avisará de que el instalador no viene
            de un desarrollador identificado. Es lo esperado mientras no haya
            certificado de firma.

            El resto de CodArch, en su canal:

            - **Web del proyecto:** https://jaminsmoke.github.io/codarch
            - **CLI:** `npm install -g codarch@next` · https://www.npmjs.com/package/codarch
            - **GitHub Action:** https://github.com/jaminsmoke/codarch-action
