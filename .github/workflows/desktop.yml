name: CodArch Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "versions.json"
      - "apps/desktop/**"
      - "packages/**"
      - "plugins/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "versions.json"
      - "apps/desktop/**"
      - "packages/**"
      - "plugins/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop.yml"

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Decidir si hay release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      latest: ${{ steps.plan.outputs.latest }}
      should_release: ${{ steps.plan.outputs.should_release }}
      should_build: ${{ steps.plan.outputs.should_build }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Leer las releases del escritorio
        id: releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAGS=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '[.[].tagName]')
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Decidir si toca publicar
        id: plan
        env:
          DESKTOP_TAGS: ${{ steps.releases.outputs.tags }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/desktop-release.ts

  build:
    name: Empaquetar ${{ matrix.os }}
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # macOS queda fuera hasta tener firma y notarización (ADR 0045).
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm ci

      - name: Construir el proceso principal y el renderer
        run: npm run desktop:build

      # electron-builder recompila los módulos nativos (tree-sitter) para el ABI
      # de Electron: en Windows hace falta la carga de trabajo de C++.
      - name: Empaquetar
        working-directory: apps/desktop
        run: npx electron-builder --publish never

      # Solo los instaladores: la carpeta "unpacked" lleva los binarios
      # sueltos y GitHub limita las peticiones al subir assets.
      - uses: actions/upload-artifact@v7
        with:
          name: codarch-desktop-${{ matrix.os }}
          path: |
            apps/desktop/release/*-setup.exe
            apps/desktop/release/*-setup.exe.blockmap
            apps/desktop/release/*.deb
            apps/desktop/release/latest*.yml
          if-no-files-found: error

  release:
    name: Publicar el release
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: instaladores
          pattern: codarch-desktop-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          # electron-updater exige una etiqueta semver: `v0.3.1-alpha.2`.
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: CodArch Desktop ${{ needs.prepare.outputs.version }}
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
          files: instaladores/**
          generate_release_notes: true
          body: |
            Instaladores de CodArch Desktop **${{ needs.prepare.outputs.version }}** para Windows y
            Linux, **sin firmar**.

            En Windows el sistema puede avisar de que el instalador no viene de
            un desarrollador identificado. Es lo esperado mientras no haya
            certificado de firma.

            En Windows y Linux la app descarga la versión nueva y la instala al
            cerrar. macOS no se publica todavía: su instalación y actualización
            necesitan firma y notarización, que no son gratuitas.

            El resto de CodArch, en su canal:

            - **Web del proyecto:** https://jaminsmoke.github.io/codarch
            - **CLI:** `npm install -g codarch@next` · https://www.npmjs.com/package/codarch
            - **GitHub Action:** https://github.com/jaminsmoke/codarch-action
