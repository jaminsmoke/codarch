name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  suite:
    name: Lint, tipos, tests y acción
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Las mismas comprobaciones que se hacen antes de cada push (AGENTS.md).
      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      # La muestra real de CodeCharta: sin ella, el render real no se prueba.
      - name: Muestras
        run: npm run samples

      - name: Tests
        run: npx vitest run

      # La acción, el workflow y el comentario del PR: que cuadren.
      - name: Acción
        run: npm run check:action

      # Una versión para el producto: la de la raíz manda (ADR 0032).
      - name: Versiones
        run: node scripts/version.mjs
