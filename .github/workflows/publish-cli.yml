name: Publicar CLI

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  publish:
    name: Publicar codarch en npm
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Trusted Publishing: npm cambia el token OIDC del workflow por un
      # permiso de publicación efímero. No hay NPM_TOKEN ni OTP.
      - name: Leer la versión
        id: version
        run: |
          VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('versions.json', 'utf8')).cli)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "codarch@$VERSION"

      - name: Comprobar si ya está publicado
        id: published
        run: |
          if npm view "codarch@${{ steps.version.outputs.version }}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "codarch@${{ steps.version.outputs.version }} ya está en npm; no se publica."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar dependencias
        if: steps.published.outputs.exists == 'false'
        run: npm ci

      - name: Construir la web que viaja con el CLI
        if: steps.published.outputs.exists == 'false'
        run: npm run web:build

      - name: Empaquetar el CLI
        if: steps.published.outputs.exists == 'false'
        run: npm run build:cli

      - name: Publicar en npm
        if: steps.published.outputs.exists == 'false'
        run: node scripts/publish-cli.mjs

      # La acción instala una versión publicada: el pin se mueve después de
      # npm, nunca antes (ADR 0041). La acción vive en este repo (ADR 0066).
      - name: Actualizar el pin de la acción
        run: node scripts/pin-action.mjs "${{ steps.version.outputs.version }}"

      - name: Guardar el pin
        run: |
          if git diff --quiet apps/github-action/action.yml; then
            echo "el pin ya estaba al día"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/github-action/action.yml
          git commit -m "chore: pin codarch ${{ steps.version.outputs.version }} en la acción"
          git push origin HEAD:main

      # `uses: jaminsmoke/codarch/apps/github-action@v1`. El tag se mueve
      # después de publicar, igual que el pin.
      - name: Mover el tag v1 de la acción
        run: |
          git tag -f v1 HEAD
          git push -f origin v1
