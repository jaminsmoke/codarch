name: Docker

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "apps/cli/**"
      - "apps/web/**"
      - "packages/**"
      - "plugins/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "versions.json"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "apps/cli/**"
      - "apps/web/**"
      - "packages/**"
      - "plugins/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "versions.json"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Construir la imagen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Leer la versión del producto
        id: version
        run: echo "version=$(node -p 'require("./versions.json").product')" >> "$GITHUB_OUTPUT"

      - name: Entrar en GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/codarch-web:latest
            ghcr.io/${{ github.repository_owner }}/codarch-web:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
