# Política de arquitectura de CodArch sobre sí mismo.
# Las reglas se evalúan en `codarch diff`; solo bloquean las violaciones introducidas.
version: 1

layers:
  - name: packages
    paths:
      - packages/**
  - name: apps
    paths:
      - apps/**

rules:
  - name: packages-no-apps
    type: forbidden
    from: packages
    to: apps
    severity: error
    message: Los paquetes del core no pueden depender de las aplicaciones

  - name: sin-ciclos
    type: cycles
    severity: error

  - name: complejidad-maxima
    type: threshold
    metric: maxComplexity
    max: 40
    severity: warn

# Los plugins que entran en el bundle (ADR 0028).
plugins:
  - ejemplo
  - vista-3d

# Los addons que este repo declara (ADR 0029): conocimiento, no código. El de
# juguete trae el perfil «core no depende de apps» y la vista guardada de
# packages/, que es también la prueba de que las apps lo leen.
addons:
  - ejemplo
