# Política de arquitectura de CodArch sobre sí mismo.
# Las reglas se evalúan en `codarch diff`; solo bloquean las violaciones introducidas.
version: 1

# Alcance del análisis (ADR 0038). Los fixtures del parser son código de
# prueba a propósito; no son arquitectura de producción.
ignore:
  - packages/*/test/fixtures/**

layers:
  - name: packages
    paths:
      - packages/**
  - name: apps
    paths:
      - apps/**

rules:
  - name: packages-no-apps
    type: forbidden
    from: packages
    to: apps
    severity: error
    message: Los paquetes del core no pueden depender de las aplicaciones

  - name: sin-ciclos
    type: cycles
    severity: error

  - name: complejidad-maxima
    type: threshold
    metric: maxComplexity
    max: 40
    severity: warn

# El lint de este repo (ADR 0094): `codarch lint` escribe .codarch/lint.json y el
# riesgo del mapa lo cuenta. Los mismos dos que corre `npm run lint`.
lint:
  - name: oxlint
    command: npx oxlint --format json .
    format: oxlint-json
  - name: eslint
    command: npx eslint . --format json
    format: eslint-json

# Los plugins que entran en el bundle (ADR 0028).
plugins:
  - vista-3d

# Los addons que este repo declara (ADR 0029): conocimiento, no código.
# Ninguno instalado; se añaden con `codarch addons add <carpeta>`.
addons: []
